<svg xmlns="http://www.w3.org/2000/svg" id="still" viewBox="0 0 360 258" role="img" aria-labelledby="title description">
  <title id="title">H2 moves 1 mm to the left</title>
  <desc id="description">H1 stays fixed on a 40 by 20 mm board. H2 moves from the solid gray circle to the dashed blue circle. Their center spacing drops from 30 to 29 mm. The SENSE track between TP1 and TP2 stays in place.</desc>
  <style>text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
#hole-motion { display: none; }
@media (prefers-reduced-motion: no-preference) {
  #hole-motion { display: inline; animation: move-hole 1.05s cubic-bezier(.2,.1,.2,1) .16s 1 both; }
}
@keyframes move-hole {
  0% { transform: translateX(8px); opacity: 0; }
  20% { opacity: .65; }
  85% { opacity: .5; }
  100% { transform: translateX(0); opacity: 0; }
}
svg:target #hole-motion { display: none !important; animation: none !important; }</style>
  <rect x="0" y="0" width="360" height="258" stroke="none" stroke-width="0" fill="#FFFFFF" />
  <g id="board-outline">
    <rect x="20" y="48" width="320" height="160" stroke="#8D8D8D" stroke-width="1.35" fill="#FFFFFF" />
  </g>
  <g id="fixed-copper">
    <polyline points="140,128 220,128" fill="none" stroke="#525252" stroke-width="2.8" stroke-linejoin="round" />
    <circle cx="140" cy="128" r="6" stroke="#525252" stroke-width="1.6" fill="#FFFFFF" />
    <circle cx="220" cy="128" r="6" stroke="#525252" stroke-width="1.6" fill="#FFFFFF" />
    <text x="180" y="112" text-anchor="middle" font-size="16" font-weight="400" fill="#525252">SENSE</text>
    <text x="140" y="156" text-anchor="middle" font-size="16" font-weight="400" fill="#525252">TP1</text>
    <text x="220" y="156" text-anchor="middle" font-size="16" font-weight="400" fill="#525252">TP2</text>
  </g>
  <g id="original-centres">
    <circle cx="60" cy="128" r="12.8" stroke="#525252" stroke-width="2.1" fill="none" />
    <circle cx="300" cy="128" r="12.8" stroke="#525252" stroke-width="2.1" fill="none" />
    <polyline points="56,128 64,128" fill="none" stroke="#525252" stroke-width="1" stroke-linejoin="round" />
    <polyline points="60,124 60,132" fill="none" stroke="#525252" stroke-width="1" stroke-linejoin="round" />
    <polyline points="296,128 304,128" fill="none" stroke="#525252" stroke-width="1" stroke-linejoin="round" />
    <polyline points="300,124 300,132" fill="none" stroke="#525252" stroke-width="1" stroke-linejoin="round" />
    <text x="80" y="101" text-anchor="middle" font-size="17" font-weight="600" fill="#161616">H1</text>
    <text x="317" y="101" text-anchor="middle" font-size="17" font-weight="600" fill="#161616">H2</text>
  </g>
  <g id="new-hole">
    <circle cx="292" cy="128" r="12.8" stroke="#0F62FE" stroke-width="2.2" fill="none" stroke-dasharray="4.3 2.7" />
    <circle cx="292" cy="128" r="2" stroke="#0F62FE" stroke-width="0" fill="#0F62FE" />
    <circle cx="292" cy="128" r="12.8" fill="none" stroke="#0F62FE" stroke-width="3" id="hole-motion" />
  </g>
  <g id="reference-distance">
    <polyline points="60,19 60,113" fill="none" stroke="#525252" stroke-width="1.05" stroke-linejoin="round" />
    <polyline points="300,19 300,113" fill="none" stroke="#525252" stroke-width="1.05" stroke-linejoin="round" />
    <polyline points="60,26 112,26" fill="none" stroke="#525252" stroke-width="1.55" stroke-linejoin="round" />
    <polyline points="248,26 300,26" fill="none" stroke="#525252" stroke-width="1.55" stroke-linejoin="round" />
    <polyline points="66,23 60,26 66,29" fill="none" stroke="#525252" stroke-width="1.4" stroke-linejoin="round" />
    <polyline points="294,23 300,26 294,29" fill="none" stroke="#525252" stroke-width="1.4" stroke-linejoin="round" />
    <text x="180" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#525252">Before  30 mm</text>
  </g>
  <g id="changed-distance">
    <polyline points="60,224 60,144" fill="none" stroke="#0F62FE" stroke-width="1.05" stroke-linejoin="round" />
    <polyline points="292,238 292,144" fill="none" stroke="#0F62FE" stroke-width="1.05" stroke-linejoin="round" />
    <polyline points="60,224 60,238" fill="none" stroke="#0F62FE" stroke-width="1.05" stroke-linejoin="round" />
    <polyline points="60,231 108,231" fill="none" stroke="#0F62FE" stroke-width="1.55" stroke-linejoin="round" />
    <polyline points="244,231 292,231" fill="none" stroke="#0F62FE" stroke-width="1.55" stroke-linejoin="round" />
    <polyline points="66,228 60,231 66,234" fill="none" stroke="#0F62FE" stroke-width="1.4" stroke-linejoin="round" />
    <polyline points="286,228 292,231 286,234" fill="none" stroke="#0F62FE" stroke-width="1.4" stroke-linejoin="round" />
    <text x="176" y="237" text-anchor="middle" font-size="18" font-weight="600" fill="#0F62FE">After  29 mm</text>
  </g>
</svg>
