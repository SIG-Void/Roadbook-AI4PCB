<!doctype html>
<html lang="{{ 'zh-CN' if lang == 'zh' else 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ title }}</title>
  <link rel="canonical" href="{{ canonical }}">
  <script>location.replace({{ target|tojson }} + location.search + {% if section %}{{ ('#' + section)|tojson }}{% else %}location.hash{% endif %});</script>
  <meta http-equiv="refresh" content="0; url={{ target }}{% if section %}#{{ section }}{% endif %}">
</head>
<body><a href="{{ target }}{% if section %}#{{ section }}{% endif %}">{{ '打开' if lang == 'zh' else 'Open' }} {{ title }}</a></body>
</html>
